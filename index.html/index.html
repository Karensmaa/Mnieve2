<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snowman – A-Frame</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene renderer="colorManagement: true; physicallyCorrectLights: true">
    <!-- Luces -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.9; castShadow: true" position="1 2 -1"></a-entity>

    <!-- Cámara -->
    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <!-- Muñeco de nieve (z = -3) -->
    <a-entity id="snowman" position="0 0 -3">
      <!-- Cuerpo -->
      <a-sphere radius="0.60" color="#FFFFFF" position="0 0.60 0" shadow="cast: true"></a-sphere>
      <a-sphere radius="0.40" color="#FFFFFF" position="0 1.10 0" shadow="cast: true"></a-sphere>
      <a-sphere radius="0.30" color="#FFFFFF" position="0 1.50 0" shadow="cast: true"></a-sphere>

      <!-- Ojos -->
      <a-sphere radius="0.03" color="#111111" position="-0.08 1.56 0.28"></a-sphere>
      <a-sphere radius="0.03" color="#111111" position="0.08 1.56 0.28"></a-sphere>

      <!-- Nariz -->
      <a-cone radius-bottom="0.04" radius-top="0" height="0.18"
              color="#FF7F00" position="0 1.50 0.33" rotation="90 0 0"></a-cone>

      <!-- Botones -->
      <a-sphere radius="0.035" color="#222222" position="0 1.22 0.34"></a-sphere>
      <a-sphere radius="0.035" color="#222222" position="0 1.08 0.36"></a-sphere>
      <a-sphere radius="0.035" color="#222222" position="0 0.94 0.34"></a-sphere>

      <!-- Brazos -->
      <a-cylinder radius="0.015" height="0.6" color="#6B4F2A"
                  position="-0.42 1.12 0" rotation="0 0 30"></a-cylinder>
      <a-cylinder radius="0.015" height="0.6" color="#6B4F2A"
                  position="0.42 1.12 0" rotation="0 0 -30"></a-cylinder>

      <!-- Sombrero -->
      <a-cylinder radius="0.18" height="0.16" color="#111111" position="0 1.78 0"></a-cylinder>
      <a-torus radius="0.22" radius-tubular="0.03" color="#111111"
               position="0 1.70 0" rotation="90 0 0"></a-torus>

    <!-- Base/piso: misma Z del muñeco (z = -3) -->
    <a-plane position="0 0 -3"
             rotation="-90 0 0"
             width="10" height="10"
             color="#7BC8A4"
             shadow="receive: true"></a-plane>

    <!-- Cielo -->
    <a-sky color="#071c42"></a-sky>
  </a-scene>
</body>
</html>
